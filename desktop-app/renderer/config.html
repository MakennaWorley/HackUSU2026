<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>GET IT DONE with Griff!</title>
		<link rel="stylesheet" href="config.css">
	</head>
	<body>
		<div class="popup-container">
			<header class="center">
				<img src="../assets/griff.png" alt="Griff" class="logo-griff">
				<img src="../assets/Logo_white_background.png" alt="GET IT DONE With Griff!" class="logo-text">
			</header>

			<!-- Status area -->
			<div id="status-area">
				<p id="status-text">Focus mode is <strong>OFF</strong></p>
				<p id="timer-text" class="hidden"></p>
			</div>

			<!-- Controls when NOT in focus -->
			<div id="start-controls">
				<label for="duration">Duration (minutes):</label>
				<input type="number" id="duration" min="1" max="480" value="25">

				<button type="button" id="btn-start" class="btn btn-primary">Start Focus</button>
			</div>

			<!-- Controls when IN focus -->
			<div id="active-controls" class="hidden"><button type="button" id="btn-stop" class="btn btn-danger">End Focus</button></div>

			<hr>

			<!-- App Categories -->
			<details id="settings-category-panel">
				<summary>App Categories</summary>

				<div class="setting-row">
					<label>Select categories to enforce:</label>
					<div id="category-checkboxes" class="category-list"></div>
				</div>
			</details>

			<!-- Add Custom Category -->
			<details id="add-category-panel">
				<summary>Add Custom Category</summary>

				<div class="setting-row">
					<label for="category-name">Category Name:</label>
					<input type="text" id="category-name" placeholder="e.g., Work Tools">
				</div>

				<div class="setting-row">
					<label for="category-desc">Description:</label>
					<input type="text" id="category-desc" placeholder="e.g., Apps I use for work">
				</div>

				<div class="setting-row">
					<label for="category-type">Category Type:</label>
					<select id="category-type">
						<option value="blocked">Blocked (distracting apps)</option>
						<option value="approved">Approved (productive apps)</option>
					</select>
				</div>

				<div class="setting-row">
					<label for="category-apps">Process Names (one per line):</label>
					<textarea id="category-apps" rows="5" spellcheck="false" placeholder="discord&#10;steam&#10;spotify"></textarea>
					<p class="help-text">Use app process names (e.g., discord, steam, spotify, code).</p>
				</div>

				<button type="button" id="btn-add-category" class="btn btn-secondary">Add Category</button>
				<span id="add-category-msg" class="hidden">Category Added &#10003;</span>
			</details>

			<!-- Manual App Additions -->
			<details id="setting-app-panel">
				<summary>Additional Apps</summary>

				<div class="setting-row">
					<label for="mode-select">Mode:</label>
					<select id="mode-select">
						<option value="blocklist">Blocklist (block these apps)</option>
						<option value="allowlist">Allowlist (only allow these apps)</option>
					</select>
				</div>

				<div class="setting-row">
					<label for="app-list">Custom Apps (one per line):</label>
					<textarea id="app-list" rows="8" spellcheck="false"></textarea>
					<p class="help-text">Add process names here. Category apps are auto-included.</p>
				</div>
			</details>

			<button type="button" id="btn-save" class="btn btn-secondary">Save Settings</button>
			<span id="save-msg" class="hidden">Saved &#10003;</span>
		</div>

		<script src="config.js"></script>
	</body>
</html>
