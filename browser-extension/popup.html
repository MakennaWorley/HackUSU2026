<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Get It Done, Griff!</title>
		<link rel="stylesheet" href="popup.css">
	</head>
	<body>
		<div class="popup-container">
			<header>
				<img src="assets/griff.png" alt="Griffin" class="logo">
				<h1>Get It Done, Griff!</h1>
			</header>

			<!-- Status area -->
			<div id="status-area">
				<p id="status-text">Focus mode is <strong>OFF</strong></p>
				<p id="timer-text" class="hidden"></p>
			</div>

			<!-- Controls when NOT in focus -->
			<div id="start-controls">
				<label for="duration">Duration (minutes):</label>
				<input type="number" id="duration" min="1" max="480" value="25">

				<button id="btn-start" class="btn btn-primary">Start Focus</button>
			</div>

			<!-- Controls when IN focus -->
			<div id="active-controls" class="hidden"><button id="btn-stop" class="btn btn-danger">End Focus</button></div>

			<hr>

			<!-- Categories -->
			<details id="settings-category-panel">
				<summary>Categories</summary>

				<div class="setting-row">
					<label>Select categories to block:</label>
					<div id="category-checkboxes" class="category-list"></div>
				</div>
			</details>

			<!-- Add Custom Category -->
			<details id="add-category-panel">
				<summary>Add Custom Category</summary>

				<div class="setting-row">
					<label for="category-name">Category Name:</label>
					<input type="text" id="category-name" placeholder="e.g., Work Distractions">
				</div>

				<div class="setting-row">
					<label for="category-desc">Description:</label>
					<input type="text" id="category-desc" placeholder="e.g., Sites that distract from work">
				</div>

				<div class="setting-row">
					<label for="category-sites">Sites (one per line):</label>
					<textarea id="category-sites" rows="5" spellcheck="false" placeholder="example.com\nreddit.com\ntwitter.com"></textarea>
				</div>

				<button id="btn-add-category" class="btn btn-secondary">Add Category</button>
				<span id="add-category-msg" class="hidden">Category Added ✓</span>
			</details>

			<!-- Manual Site Additions -->
			<details id="setting-website-panel">
				<summary>Additional Websites</summary>

				<div class="setting-row">
					<label for="mode-select">Mode:</label>
					<select id="mode-select">
						<option value="blacklist">Blacklist (block these sites)</option>
						<option value="whitelist">Whitelist (only allow these sites)</option>
					</select>
				</div>

				<div class="setting-row">
					<label for="site-list">Custom Sites (one per line):</label>
					<textarea id="site-list" rows="8" spellcheck="false"></textarea>
					<p class="help-text">Add your own sites here. Category sites are auto-included.</p>
				</div>
			</details>

			<button id="btn-save" class="btn btn-secondary">Save Settings</button>
			<span id="save-msg" class="hidden">Saved ✓</span>
		</div>

		<script src="popup.js"></script>
	</body>
</html>
